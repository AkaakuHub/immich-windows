name: static-windows-port-audit

on:
  pull_request:
    branches: [main]
    paths-ignore: [README.md, 'docs/**']
  push:
    branches: [main]
    paths-ignore: [README.md, 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Parse PowerShell and verify pins
        shell: pwsh
        run: |
          .\tests\Static-RepositoryAudit.ps1
          .\tests\Update-Workflow.ps1
      - name: Verify patch stack applies to pristine upstream tag
        shell: pwsh
        run: |
          $source = Join-Path $env:RUNNER_TEMP 'immich-upstream'
          .\build\Prepare-Source.ps1 -Destination $source
          .\tests\Static-RepositoryAudit.ps1 -SourceRoot $source
