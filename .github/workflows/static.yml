name: static-windows-port-audit

on:
  push:
    branches: [main]
    paths-ignore: [README.md, 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Parse PowerShell and verify pins
        shell: pwsh
        run: .\tests\Static-RepositoryAudit.ps1
      - name: Verify patch stack applies to pristine upstream tag
        shell: pwsh
        run: .\build\Prepare-Source.ps1 -Destination (Join-Path $env:RUNNER_TEMP 'immich-upstream')
