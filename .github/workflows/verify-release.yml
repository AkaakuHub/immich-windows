name: verify-windows-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Immich release tag, for example v3.2.2
        required: true
        type: string
      publish:
        description: Publish the verified draft release
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  verify:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - name: Download and inspect draft package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if ($env:RELEASE_VERSION -notmatch '^v\d+\.\d+\.\d+$') { throw 'Invalid release version.' }
          $release = & gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_VERSION" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $release.draft) { throw 'A draft release is required.' }
          $folder = "immich-windows-$env:RELEASE_VERSION-win-x64"
          $assetName = "$folder.tar.gz"
          if (@($release.assets | Where-Object name -eq $assetName).Count -ne 1) { throw "Missing release asset: $assetName" }
          & gh release download $env:RELEASE_VERSION --repo $env:GITHUB_REPOSITORY --pattern $assetName --dir $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw 'Could not download release asset.' }
          $archive = Join-Path $env:RUNNER_TEMP $assetName
          & tar.exe -xzf $archive -C $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw 'Could not extract release asset.' }
          $package = Join-Path $env:RUNNER_TEMP $folder
          & ./packaging/Test-ReleasePackage.ps1 -PackageRoot $package -Version $env:RELEASE_VERSION
          $manifest = Get-Content -Raw -LiteralPath (Join-Path $package 'manifest.json') | ConvertFrom-Json
          $node = Join-Path $package 'runtime/node/node.exe'
          if ((& $node --version).Trim() -ne "v$($manifest.dependencies.node.version)") { throw 'Packaged Node version differs from manifest.' }
          $python = Join-Path $package 'machine-learning/python-runtime/python.exe'
          & $python -c 'import onnxruntime, insightface; assert "CPUExecutionProvider" in onnxruntime.get_available_providers()'
          if ($LASTEXITCODE -ne 0) { throw 'Packaged ML runtime could not load.' }
          $ffmpeg = Join-Path $package 'runtime/ffmpeg/ffmpeg.exe'
          & $ffmpeg -version | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Packaged FFmpeg could not start.' }
          "Verified draft release $env:RELEASE_VERSION on Windows." | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
      - name: Publish verified release
        if: ${{ inputs.publish }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          & gh release edit $env:RELEASE_VERSION --repo $env:GITHUB_REPOSITORY --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the verified release.' }
