name: check-upstream-immich-release

on:
  schedule:
    - cron: '43 19 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: automatic-upstream-update
  cancel-in-progress: false

jobs:
  check:
    if: github.event.repository.private == false && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Prepare a new stable release only when upstream changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/check_upstream.py
