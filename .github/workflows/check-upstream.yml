name: check-upstream-immich-release

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.event.repository.private == false
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare pinned and latest stable release
        shell: powershell
        run: |
          $pin = Get-Content -Raw .\upstream.json | ConvertFrom-Json
          $headers = @{ 'User-Agent' = 'AkaakuHub-immich-windows' }
          $latest = Invoke-RestMethod -Headers $headers -Uri 'https://api.github.com/repos/immich-app/immich/releases/latest'
          @"
          ## Immich upstream check

          - pinned: ``$($pin.version)``
          - latest stable: ``$($latest.tag_name)``
          - pinned commit: ``$($pin.commit)``
          "@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          if ($latest.tag_name -ne $pin.version) {
            throw "A newer stable Immich release exists: $($latest.tag_name). Follow README.md's upstream update procedure; do not update automatically."
          }
          Write-Host "Pinned release $($pin.version) is still the latest stable release."
