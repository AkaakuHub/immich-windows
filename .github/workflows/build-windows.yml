name: build-windows-native

on:
  pull_request:
    branches: [main]
    paths-ignore: [README.md, 'docs/**']
  push:
    branches: [main]
    paths-ignore: [README.md, 'docs/**']
  workflow_dispatch:
    inputs:
      component:
        type: choice
        options: [all, codec, postgres, migration]
        default: all

permissions:
  contents: read

concurrency:
  group: build-windows-native-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
      reuse: ${{ steps.plan.outputs.reuse }}
      run_id: ${{ steps.plan.outputs.run_id }}
      artifact_id: ${{ steps.plan.outputs.artifact_id }}
      artifact_digest: ${{ steps.plan.outputs.artifact_digest }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Select existing qualification or a fresh build
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          COMPONENT: ${{ inputs.component }}
        run: python .github/scripts/qualified_release.py plan
  validate:
    needs: plan
    if: needs.plan.outputs.reuse != 'true'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Test artifact promotion and rejection policies
        run: python -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Verify pins, patches, update policy and dependency reuse once
        shell: pwsh
        run: |
          $source = Join-Path $env:RUNNER_TEMP 'immich-upstream'
          ./build/Prepare-Source.ps1 -Destination $source
          ./tests/Static-RepositoryAudit.ps1 -SourceRoot $source
          ./tests/Update-Workflow.ps1
          ./tests/Update-FromRelease.ps1
          ./tests/Dependency-Reuse.ps1
          ./tests/Startup-Workflow.ps1
          ./tests/NativeMedia-Build.ps1
          ./tests/Native-Probe.ps1
          ./tests/Source-Preparation.ps1
          node ./tests/Server-Portability.cjs $source
          if ($LASTEXITCODE -ne 0) { throw "Server path portability checks failed." }
          python ./tests/MachineLearning-Lifecycle.py $source
          if ($LASTEXITCODE -ne 0) { throw "Machine Learning lifecycle policy checks failed." }
  codec:
    needs: [plan, validate]
    if: github.event_name == 'push' || github.event_name == 'pull_request' || inputs.component == 'all' || inputs.component == 'codec'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Select libvips cache key
        id: codec-key
        shell: pwsh
        run: ./build/Write-NativeBuildCacheKeys.ps1 -OutputPath $env:GITHUB_OUTPUT
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: codec-cache
        with:
          path: artifacts/native/sharp-libvips-custom
          key: libvips-${{ runner.os }}-${{ steps.codec-key.outputs.codec }}-${{ hashFiles('build/Build-CustomSharpLibvips.ps1', 'build/NativeMediaValidation.psm1', 'build/Common.psm1', 'media-patches/**') }}
      - name: Cross-build Windows libvips
        if: steps.codec-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./build/Build-CustomSharpLibvips.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: libvips
          path: artifacts/native/sharp-libvips-custom
          retention-days: 1
          if-no-files-found: error
  postgres:
    needs: [plan, validate]
    if: github.event_name == 'push' || github.event_name == 'pull_request' || inputs.component == 'all' || inputs.component == 'postgres'
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Select PostgreSQL extension cache key
        id: postgres-key
        shell: pwsh
        run: ./build/Write-NativeBuildCacheKeys.ps1 -OutputPath $env:GITHUB_OUTPUT
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: postgres-cache
        with:
          path: artifacts/native/postgres-extensions
          key: postgres-extensions-${{ runner.os }}-${{ steps.postgres-key.outputs.postgres }}-${{ hashFiles('build/Build-PgVector.ps1', 'build/Build-VectorChord.ps1', 'build/Write-PostgresBuildMetadata.ps1', 'build/Common.psm1') }}
      - name: Build PostgreSQL 18 extensions
        if: steps.postgres-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $pgVersion = (Get-Content -Raw dependencies/versions.json | ConvertFrom-Json).postgresql.chocolateyVersion
          choco install postgresql18 --version $pgVersion -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'PostgreSQL 18 installation failed.' }
          $env:LIBCLANG_PATH = 'C:\Program Files\LLVM\bin'
          .\build\Enter-VsDevEnvironment.ps1
          .\build\Build-PgVector.ps1 -PostgresRoot 'C:\Program Files\PostgreSQL\18'
          .\build\Build-VectorChord.ps1 -PostgresRoot 'C:\Program Files\PostgreSQL\18' -InstallCargoPgrx
          .\build\Write-PostgresBuildMetadata.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: postgres-extensions
          path: artifacts/native/postgres-extensions
          retention-days: 1
          if-no-files-found: error
  migration:
    needs: [plan, validate]
    if: inputs.component == 'migration'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build migration tools archive
        shell: pwsh
        run: ./packaging/New-MigrationToolsArchive.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: migration-tools
          path: dist/*-migration-tools.zip
          if-no-files-found: error
  assemble:
    if: ${{ (github.event_name == 'push' || github.event_name == 'pull_request' || inputs.component == 'all') && needs.codec.result == 'success' && needs.postgres.result == 'success' }}
    needs: [plan, validate, codec, postgres]
    runs-on: windows-2025
    timeout-minutes: 180
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: libvips
          path: artifacts/native/sharp-libvips-custom
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: postgres-extensions
          path: artifacts/native/postgres-extensions
      - name: Select application cache keys
        id: application-key
        shell: pwsh
        run: ./build/Write-AppBuildCacheKeys.ps1 -OutputPath $env:GITHUB_OUTPUT
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: application-cache
        with:
          path: artifacts/application
          key: application-${{ runner.os }}-${{ steps.application-key.outputs.application }}-${{ hashFiles('upstream.json', 'patches/server/**', 'patches/series', 'build/Write-AppBuildCacheKeys.ps1', 'build/Build-All.ps1', 'build/Build-Immich.ps1', 'build/Fetch-Geodata.ps1', 'build/Prepare-Source.ps1', 'build/Bootstrap-BuildTools.ps1', 'build/Common.psm1') }}
          restore-keys: application-${{ runner.os }}-
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: ml-cache
        with:
          path: artifacts/machine-learning
          key: machine-learning-${{ runner.os }}-${{ steps.application-key.outputs.machineLearning }}-${{ hashFiles('upstream.json', 'patches/machine-learning/**', 'patches/series', 'build/Write-AppBuildCacheKeys.ps1', 'build/Build-All.ps1', 'build/Build-MachineLearning.ps1', 'build/Prepare-Source.ps1', 'build/Bootstrap-BuildTools.ps1', 'build/Common.psm1') }}
          restore-keys: machine-learning-${{ runner.os }}-
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: build-downloads
        with:
          path: .cache
          key: build-downloads-${{ runner.os }}-${{ hashFiles('dependencies/versions.json', 'build/Bootstrap-BuildTools.ps1', 'build/Fetch-NodeRuntime.ps1', 'tests/Fetch-MediaFixtures.ps1') }}
      - name: Build and qualify Windows package
        shell: pwsh
        run: |
          $fixtures = @(./tests/Fetch-MediaFixtures.ps1 -Destination (Join-Path $env:GITHUB_WORKSPACE '.cache/media-fixtures'))
          .\build\Enter-VsDevEnvironment.ps1
          .\build\Build-All.ps1 -SkipNativeDependencies -CustomSharpLibvipsBundle ./artifacts/native/sharp-libvips-custom -SharpFixture $fixtures
          .\build\Stage-VcRuntime.ps1
          $version = '${{ needs.plan.outputs.version }}'
          $folder = "immich-windows-$version-win-x64"
          .\packaging\New-NativeDependenciesArchive.ps1
          .\packaging\New-Package.ps1
          & "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe" -NoProfile -File ./tests/Tray-Controller.ps1 -Executable "dist/$folder/runtime/tray/ImmichTray.exe" -IconPath "dist/$folder/build/www/favicon.ico"
          if ($LASTEXITCODE -ne 0) { throw 'Notification-area controller tests failed.' }
          .\packaging\Test-ReleasePackage.ps1 -PackageRoot "dist/$folder" -Version $version
          Compress-Archive -Path "dist/$folder" -DestinationPath "dist/$folder.zip" -CompressionLevel Optimal -Force
          .\packaging\New-MigrationToolsArchive.ps1
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: steps.application-cache.outputs.cache-hit != 'true'
        with:
          path: artifacts/application
          key: ${{ steps.application-cache.outputs.cache-primary-key }}
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: steps.ml-cache.outputs.cache-hit != 'true'
        with:
          path: artifacts/machine-learning
          key: ${{ steps.ml-cache.outputs.cache-primary-key }}
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: steps.build-downloads.outputs.cache-hit != 'true'
        with:
          path: .cache
          key: ${{ steps.build-downloads.outputs.cache-primary-key }}
      - name: Select PostgreSQL runtime cache key
        id: pg-runtime
        shell: pwsh
        run: |
          $version = (Get-Content -Raw dependencies/versions.json | ConvertFrom-Json).postgresql.chocolateyVersion
          "version=$version" >> $env:GITHUB_OUTPUT
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: pg-runtime-cache
        with:
          path: C:\Program Files\PostgreSQL\18
          key: postgresql-runtime-${{ runner.os }}-${{ steps.pg-runtime.outputs.version }}
      - name: Start PostgreSQL test service
        shell: pwsh
        run: |
          .\tests\actions\Start-TestPostgres.ps1 -PostgresRoot 'C:\Program Files\PostgreSQL\18' `
            -DataRoot (Join-Path $env:RUNNER_TEMP 'postgresql18-data') `
            -PasswordFile (Join-Path $env:RUNNER_TEMP 'immich-postgres-password.txt')
          $env:PGHOST='127.0.0.1'
          $env:PGPORT='5432'
          $env:PGUSER='postgres'
          $env:PGDATABASE='postgres'
          $env:PGPASSWORD=Get-Content -Raw -LiteralPath (Join-Path $env:RUNNER_TEMP 'immich-postgres-password.txt')
          try {
            & ./.tools/node/node.exe ./tests/Server-Portability.cjs .work/immich --server-root artifacts/application/server --psql 'C:\Program Files\PostgreSQL\18\bin\psql.exe'
            if ($LASTEXITCODE -ne 0) { throw 'PostgreSQL path portability checks failed.' }
          } finally { Remove-Item Env:PGPASSWORD -ErrorAction SilentlyContinue }
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: steps.pg-runtime-cache.outputs.cache-hit != 'true'
        with:
          path: C:\Program Files\PostgreSQL\18
          key: postgresql-runtime-${{ runner.os }}-${{ steps.pg-runtime.outputs.version }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: runtime-downloads
        with:
          path: |
            ${{ runner.temp }}/immich-install/cache/downloads
            !${{ runner.temp }}/immich-install/cache/downloads/immich-windows-*
            ${{ runner.temp }}/immich-install/cache/npm
            ${{ runner.temp }}/immich-install/cache/uv
            ${{ runner.temp }}/immich-install/cache/pnpm-store
          key: runtime-downloads-${{ runner.os }}-${{ hashFiles('dependencies/versions.json', 'artifacts/machine-learning/requirements.txt', 'dist/**/pnpm-lock.yaml') }}
      - name: Install and smoke test the thin package
        shell: pwsh
        run: |
          $version = '${{ needs.plan.outputs.version }}'
          $folder = "immich-windows-$version-win-x64"
          $installRoot = Join-Path $env:RUNNER_TEMP 'immich-install'
          $dataRoot = Join-Path $env:RUNNER_TEMP 'immich-data'
          $mediaRoot = Join-Path $env:RUNNER_TEMP 'immich-media'
          $expanded = Join-Path $env:RUNNER_TEMP 'immich-package'
          Expand-Archive -LiteralPath "dist/$folder.zip" -DestinationPath $expanded
          $packageRoot = Join-Path $expanded $folder
          & "$packageRoot/installer/Test-ReleasePackage.ps1" -PackageRoot $packageRoot -Version $version
          $downloadCache = Join-Path $installRoot 'cache\downloads'
          New-Item -ItemType Directory -Path $downloadCache,$mediaRoot -Force | Out-Null
          $pins = Get-Content -Raw dependencies/versions.json | ConvertFrom-Json
          foreach ($archive in @($pins.node.asset, "uv-$($pins.uv.version)-$($pins.uv.asset)")) {
            Copy-Item (Join-Path '.cache' $archive) $downloadCache -Force
          }
          Copy-Item "dist/immich-windows-$version-native-dependencies.zip" $downloadCache
          $password = Get-Content -Raw -LiteralPath (Join-Path $env:RUNNER_TEMP 'immich-postgres-password.txt')
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot;$PSHOME"
          & "$packageRoot/installer/Install.ps1" -PackageRoot $packageRoot -Scope AllUsers `
            -InstallRoot $installRoot -DataRoot $dataRoot -MediaRoot $mediaRoot `
            -DatabasePassword $password -PostgresRoot 'C:\Program Files\PostgreSQL\18'
          $fixtures = @(Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE '.cache/media-fixtures') -File -Recurse | Select-Object -ExpandProperty FullName)
          & "$packageRoot/tests/Smoke-Windows.ps1" -InstallRoot $installRoot -DataRoot $dataRoot `
            -PostgresRoot 'C:\Program Files\PostgreSQL\18' -SharpFixture $fixtures
          ./tests/actions/Test-RevisionUpgrade.ps1 -PackageRoot $packageRoot -InstallRoot $installRoot -DataRoot $dataRoot -Scope AllUsers
          ./tests/actions/Test-MachineLearningLifecycle.ps1 -InstallRoot $installRoot -DataRoot $dataRoot
          & "$installRoot/current/runtime/launchers/Stop-Immich.ps1" -InstallRoot $installRoot -DataRoot $dataRoot -EnvFile "$dataRoot/immich.env"
          $userRoot = Join-Path $env:LOCALAPPDATA 'Programs\Immich'
          $userData = Join-Path $env:LOCALAPPDATA 'Immich'
          New-Item -ItemType Directory -Path $userRoot -Force | Out-Null
          New-Item -ItemType Junction -Path "$userRoot/cache" -Target "$installRoot/cache" | Out-Null
          & "$packageRoot/installer/Install.ps1" -PackageRoot $packageRoot -Scope CurrentUser `
            -InstallRoot $userRoot -DataRoot $userData -EnvFile "$dataRoot/immich.env"
          & "$packageRoot/tests/Smoke-Windows.ps1" -InstallRoot $userRoot -DataRoot $userData -SharpFixture $fixtures
          ./tests/actions/Test-RevisionUpgrade.ps1 -PackageRoot $packageRoot -InstallRoot $userRoot -DataRoot $userData -Scope CurrentUser -UseLegacyMachineLearning
          ./tests/actions/Test-MachineLearningLifecycle.ps1 -InstallRoot $userRoot -DataRoot $userData
          & "$userRoot/current/runtime/launchers/Stop-Immich.ps1" -InstallRoot $userRoot -DataRoot $userData -EnvFile "$userData/immich.env"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: always() && !cancelled() && steps.runtime-downloads.outputs.cache-primary-key != '' && steps.runtime-downloads.outputs.cache-hit != 'true'
        with:
          path: |
            ${{ runner.temp }}/immich-install/cache/downloads
            !${{ runner.temp }}/immich-install/cache/downloads/immich-windows-*
            ${{ runner.temp }}/immich-install/cache/npm
            ${{ runner.temp }}/immich-install/cache/uv
            ${{ runner.temp }}/immich-install/cache/pnpm-store
          key: ${{ steps.runtime-downloads.outputs.cache-primary-key }}
      - name: Record the actual tested checkout and asset hashes
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: python .github/scripts/qualified_release.py record --version "$env:VERSION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: qualified-windows-package-v1
          path: |
            dist/*-win-x64.zip
            dist/*-native-dependencies.zip
            dist/*-migration-tools.zip
            dist/Install.cmd
            dist/qualification.json
          retention-days: 14
          if-no-files-found: error
  publish:
    needs: [plan, assemble]
    if: ${{ always() && !cancelled() && github.ref == 'refs/heads/main' && needs.plan.result == 'success' && needs.plan.outputs.publish == 'true' && (needs.plan.outputs.reuse == 'true' || needs.assemble.result == 'success') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Verify the exact qualified artifact before publication
        id: qualified
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFIED_RUN_ID: ${{ needs.plan.outputs.run_id }}
          QUALIFIED_ARTIFACT_ID: ${{ needs.plan.outputs.artifact_id }}
          QUALIFIED_ARTIFACT_DIGEST: ${{ needs.plan.outputs.artifact_digest }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: python .github/scripts/qualified_release.py prepare-publish --version "$VERSION"
      - name: Publish qualified release without rebuilding or repacking
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          BUILD_COMMIT: ${{ steps.qualified.outputs.source_commit }}
          SOURCE_TREE: ${{ steps.qualified.outputs.source_tree }}
          BUILD_RUN: ${{ steps.qualified.outputs.run_id }}
          ARTIFACT_ID: ${{ steps.qualified.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ steps.qualified.outputs.artifact_digest }}
        run: |
          $version = $env:VERSION
          $folder = "immich-windows-$version-win-x64"
          $native = "dist/immich-windows-$version-native-dependencies.zip"
          $migration = "dist/immich-windows-$version-migration-tools.zip"
          $launcher = "dist/Install.cmd"
          $notes = "Immich Windows $version. Release commit: $env:GITHUB_SHA. Actual build commit: $env:BUILD_COMMIT. Source tree: $env:SOURCE_TREE. Qualified run: https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:BUILD_RUN. Artifact: $env:ARTIFACT_ID ($env:ARTIFACT_DIGEST). The tested assets are published byte-for-byte."
          & gh release create $version --repo $env:GITHUB_REPOSITORY "dist/$folder.zip" $native $migration $launcher --draft --target $env:GITHUB_SHA --title $version --notes $notes
          if ($LASTEXITCODE -ne 0) { throw "Could not publish immutable release $version. Never overwrite a published revision." }
          & gh release edit $version --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw "Validated assets remain in draft release $version; publication failed." }
