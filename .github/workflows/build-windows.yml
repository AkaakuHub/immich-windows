name: build-windows-native

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codec:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
      - name: Cross-build Windows libvips
        shell: pwsh
        run: ./build/Build-CustomSharpLibvips.ps1
  build:
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - name: Build server, web, and machine learning
        shell: pwsh
        run: |
          .\build\Enter-VsDevEnvironment.ps1
          .\build\Build-All.ps1 -SkipNativeDependencies
