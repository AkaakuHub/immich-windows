name: build-windows-native

on:
  workflow_dispatch:
    inputs:
      component:
        type: choice
        options: [all, codec, postgres, assemble]
        default: all
      source_run_id:
        description: Existing run containing the codec and PostgreSQL artifacts; required for assemble
        type: string

permissions:
  contents: read

jobs:
  codec:
    if: inputs.component == 'all' || inputs.component == 'codec'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
      - name: Select libvips cache key
        id: codec-key
        shell: pwsh
        run: ./build/Write-NativeBuildCacheKeys.ps1 -OutputPath $env:GITHUB_OUTPUT
      - uses: actions/cache@v6
        id: codec-cache
        with:
          path: artifacts/native/sharp-libvips-custom
          key: libvips-${{ runner.os }}-${{ steps.codec-key.outputs.codec }}-${{ hashFiles('build/Build-CustomSharpLibvips.ps1', 'build/Common.psm1', 'media-patches/**') }}
      - name: Cross-build Windows libvips
        if: steps.codec-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./build/Build-CustomSharpLibvips.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: libvips
          path: artifacts/native/sharp-libvips-custom
          retention-days: 1
          if-no-files-found: error
  postgres:
    if: inputs.component == 'all' || inputs.component == 'postgres'
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - name: Select PostgreSQL extension cache key
        id: postgres-key
        shell: pwsh
        run: ./build/Write-NativeBuildCacheKeys.ps1 -OutputPath $env:GITHUB_OUTPUT
      - uses: actions/cache@v6
        id: postgres-cache
        with:
          path: artifacts/native/postgres-extensions
          key: postgres-extensions-${{ runner.os }}-${{ steps.postgres-key.outputs.postgres }}-${{ hashFiles('build/Build-PgVector.ps1', 'build/Build-VectorChord.ps1', 'build/Write-PostgresBuildMetadata.ps1', 'build/Common.psm1') }}
      - name: Build PostgreSQL 18 extensions
        if: steps.postgres-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          choco install postgresql18 --version 18.6.3 -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'PostgreSQL 18 installation failed.' }
          $env:LIBCLANG_PATH = 'C:\Program Files\LLVM\bin'
          .\build\Enter-VsDevEnvironment.ps1
          .\build\Build-PgVector.ps1 -PostgresRoot 'C:\Program Files\PostgreSQL\18'
          .\build\Build-VectorChord.ps1 -PostgresRoot 'C:\Program Files\PostgreSQL\18' -InstallCargoPgrx
          .\build\Write-PostgresBuildMetadata.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: postgres-extensions
          path: artifacts/native/postgres-extensions
          retention-days: 1
          if-no-files-found: error
  assemble:
    if: ${{ always() && ((inputs.component == 'all' && needs.codec.result == 'success' && needs.postgres.result == 'success') || (inputs.component == 'assemble' && inputs.source_run_id != '')) }}
    needs: [codec, postgres]
    runs-on: windows-2025
    timeout-minutes: 180
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: libvips
          path: artifacts/native/sharp-libvips-custom
          github-token: ${{ github.token }}
          run-id: ${{ (inputs.component == 'assemble' && inputs.source_run_id) || github.run_id }}
      - uses: actions/download-artifact@v7
        with:
          name: postgres-extensions
          path: artifacts/native/postgres-extensions
          github-token: ${{ github.token }}
          run-id: ${{ (inputs.component == 'assemble' && inputs.source_run_id) || github.run_id }}
      - name: Build and qualify Windows package
        shell: pwsh
        run: |
          $fixtures = @(./tests/Fetch-MediaFixtures.ps1 -Destination (Join-Path $env:RUNNER_TEMP 'immich-fixtures'))
          .\build\Enter-VsDevEnvironment.ps1
          .\build\Build-All.ps1 -SkipNativeDependencies -CustomSharpLibvipsBundle ./artifacts/native/sharp-libvips-custom -SharpFixture $fixtures
          .\build\Stage-VcRuntime.ps1
          $version = (Get-Content -Raw upstream.json | ConvertFrom-Json).version
          $folder = "immich-windows-$version-win-x64"
          .\packaging\New-Package.ps1
          .\packaging\Test-ReleasePackage.ps1 -PackageRoot "dist/$folder" -Version $version
          Compress-Archive -Path "dist/$folder" -DestinationPath "dist/$folder.zip" -CompressionLevel Optimal -Force
          .\packaging\New-NativeDependenciesArchive.ps1
      - name: Install and smoke test the thin package
        shell: pwsh
        run: |
          $version = (Get-Content -Raw upstream.json | ConvertFrom-Json).version
          $folder = "immich-windows-$version-win-x64"
          $installRoot = Join-Path $env:RUNNER_TEMP 'immich-install'
          $dataRoot = Join-Path $env:RUNNER_TEMP 'immich-data'
          $mediaRoot = Join-Path $env:RUNNER_TEMP 'immich-media'
          $downloadCache = Join-Path $installRoot 'cache\downloads'
          New-Item -ItemType Directory -Path $downloadCache,$mediaRoot -Force | Out-Null
          Copy-Item "dist/immich-windows-$version-native-dependencies.zip" $downloadCache
          $password = [guid]::NewGuid().ToString('N')
          choco install postgresql18 --version 18.6.3 --params "/Password:$password" -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'PostgreSQL 18 installation failed.' }
          Start-Service postgresql-x64-18
          & "dist/$folder/installer/Install.ps1" -PackageRoot "dist/$folder" -Scope AllUsers `
            -InstallRoot $installRoot -DataRoot $dataRoot -MediaRoot $mediaRoot `
            -DatabasePassword $password -PostgresRoot 'C:\Program Files\PostgreSQL\18'
          $fixtures = @(Get-ChildItem (Join-Path $env:RUNNER_TEMP 'immich-fixtures') -File -Recurse | Select-Object -ExpandProperty FullName)
          & "dist/$folder/tests/Smoke-Windows.ps1" -InstallRoot $installRoot -DataRoot $dataRoot `
            -PostgresRoot 'C:\Program Files\PostgreSQL\18' -SharpFixture $fixtures
      - name: Upload qualified release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content -Raw upstream.json | ConvertFrom-Json).version
          $folder = "immich-windows-$version-win-x64"
          $native = "dist/immich-windows-$version-native-dependencies.zip"
          & gh release view $version --json isDraft *> $null
          if ($LASTEXITCODE -eq 0) {
            & gh release upload $version "dist/$folder.zip" $native --clobber
            if ($LASTEXITCODE -ne 0) { throw "Could not update release $version." }
            $oldArchive = & gh release view $version --json assets --jq '.assets[].name' | Where-Object { $_ -eq "immich-windows-$version-win-x64.tar.gz" }
            if ($oldArchive) {
              & gh release delete-asset $version $oldArchive --yes
              if ($LASTEXITCODE -ne 0) { throw "Could not remove obsolete tar.gz asset from $version." }
            }
          } else {
            & gh release create $version "dist/$folder.zip" $native --title $version
            if ($LASTEXITCODE -ne 0) { throw "Could not create release $version." }
          }
