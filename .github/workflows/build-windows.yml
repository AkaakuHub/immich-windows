name: build-windows-native
run-name: >-
  ${{ inputs.upstream_pr && format('Qualify upstream PR #{0} head={1} base={2}', inputs.upstream_pr, inputs.expected_head, inputs.expected_base) || inputs.qualified_run_id && format('Promote qualified run {0} at {1}', inputs.qualified_run_id, inputs.expected_merge) || github.event.pull_request.title || github.event.head_commit.message || 'Windows qualification' }}

on:
  pull_request:
    branches: [main]
    paths-ignore: [README.md, 'docs/**']
  push:
    branches: [main]
    paths-ignore: [README.md, 'docs/**']
  workflow_dispatch:
    inputs:
      component:
        type: choice
        options: [all, codec, postgres, migration]
        default: all
      upstream_pr:
        description: Automatic upstream PR number (trusted main dispatch only)
        type: string
      expected_head:
        description: Exact automatic PR head SHA
        type: string
      expected_base:
        description: Exact main base SHA for qualification
        type: string
      qualified_run_id:
        description: Successful automatic qualification to promote without rebuilding
        type: string
      qualified_artifact_id:
        description: Exact qualified artifact ID
        type: string
      qualified_artifact_digest:
        description: Exact qualified artifact SHA-256 digest
        type: string
      expected_merge:
        description: Exact merged main SHA to publish
        type: string

permissions:
  contents: read

concurrency:
  group: build-windows-native-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    # Bot-created update PRs are qualified only by their explicit trusted-main
    # dispatch, even if GitHub also queues an approval-pending PR event.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.login != 'github-actions[bot]' || !startsWith(github.event.pull_request.head.ref, 'automation/upstream-') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      test_reuse: ${{ steps.test-reuse.outputs.test_reuse }}
      checkout: ${{ steps.plan.outputs.checkout }}
      publish: ${{ steps.plan.outputs.publish }}
      reuse: ${{ steps.plan.outputs.reuse }}
      metadata_only: ${{ steps.plan.outputs.metadata_only }}
      run_id: ${{ steps.plan.outputs.run_id }}
      artifact_id: ${{ steps.plan.outputs.artifact_id }}
      artifact_digest: ${{ steps.plan.outputs.artifact_digest }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install strict workflow parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Select existing qualification or a fresh build
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          COMPONENT: ${{ inputs.component }}
        run: python .github/scripts/qualified_release.py plan
      - name: Reuse unchanged Windows qualification inputs
        id: test-reuse
        env:
          GH_TOKEN: ${{ github.token }}
          CI_ONLY: ${{ steps.plan.outputs.publish == 'false' && steps.plan.outputs.reuse != 'true' }}
        run: python .github/scripts/reuse_qualification.py plan
  ci-tools:
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.plan.outputs.checkout || github.sha }}
          persist-credentials: false
      - name: Install strict workflow parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Test current CI scripts and workflow contracts
        run: python -m unittest discover -s .github/scripts -p 'test_*.py' -v
  validate:
    needs: plan
    if: needs.plan.outputs.reuse != 'true' && needs.plan.outputs.test_reuse != 'true'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.plan.outputs.checkout || github.sha }}
          persist-credentials: false
      - name: Verify pins, patches, update policy and dependency reuse once
        if: needs.plan.outputs.test_reuse != 'true'
        shell: pwsh
        run: |
          $source = Join-Path $env:RUNNER_TEMP 'immich-upstream'
          ./build/Prepare-Source.ps1 -Destination $source
          # Independent checks get separate processes and all report once. A failure
          # must fail this gate, but should not hide failures in later checks.
          $PSNativeCommandUseErrorActionPreference = $false
          $failed = [Collections.Generic.List[string]]::new()
          foreach ($name in @('Static-RepositoryAudit','Update-Workflow','Release-Cleanup','Tray-Lifecycle','Update-FromRelease','Install-Bootstrap','Metadata-DateRepair-Launcher','Upgrade-Baseline','Dependency-Reuse','Dependency-Transfer','Node-DependencyReuse','Startup-Workflow','NativeMedia-Build','Native-Probe','Source-Preparation','MachineLearning-Diagnostics')) {
            $arguments = @('-NoLogo','-NoProfile','-File',"./tests/$name.ps1")
            if ($name -eq 'Static-RepositoryAudit') { $arguments += @('-SourceRoot',$source) }
            & "$PSHOME/pwsh.exe" @arguments
            if ($LASTEXITCODE -ne 0) { $failed.Add($name) }
          }
          node ./tests/Server-Portability.cjs $source
          if ($LASTEXITCODE -ne 0) { $failed.Add('Server-Portability') }
          python ./tests/MachineLearning-Lifecycle.py $source
          if ($LASTEXITCODE -ne 0) { $failed.Add('MachineLearning-Lifecycle') }
          if ($failed.Count) { throw "Validation failed: $($failed -join ', ')" }
  codec:
    needs: [plan, validate]
    if: needs.plan.outputs.test_reuse != 'true' && (github.event_name == 'push' || github.event_name == 'pull_request' || inputs.component == 'all' || inputs.component == 'codec')
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.plan.outputs.checkout || github.sha }}
          persist-credentials: false
      - name: Select libvips cache key
        id: codec-key
        shell: pwsh
        run: ./build/Write-NativeBuildCacheKeys.ps1 -OutputPath $env:GITHUB_OUTPUT
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: codec-cache
        with:
          path: artifacts/native/sharp-libvips-custom
          key: libvips-${{ runner.os }}-${{ steps.codec-key.outputs.codec }}-${{ hashFiles('build/Build-CustomSharpLibvips.ps1', 'build/NativeMediaValidation.psm1', 'build/Common.psm1', 'media-patches/**') }}
      - name: Reuse qualified raw libvips from the merged PR base
        if: steps.codec-cache.outputs.cache-hit != 'true' && (github.event_name == 'pull_request' || inputs.upstream_pr != '')
        id: native-reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/qualified_release.py prepare-native
      - name: Cross-build Windows libvips
        if: steps.codec-cache.outputs.cache-hit != 'true' && steps.native-reuse.outputs.reused != 'true'
        shell: pwsh
        run: ./build/Build-CustomSharpLibvips.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: libvips
          path: artifacts/native/sharp-libvips-custom
          retention-days: 14
          if-no-files-found: error
  seed-codec-cache:
    needs: plan
    if: (github.event_name == 'push' || inputs.qualified_run_id != '') && github.ref == 'refs/heads/main' && needs.plan.outputs.reuse == 'true' && needs.plan.outputs.metadata_only != 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.plan.outputs.checkout || github.sha }}
          persist-credentials: false
      - name: Select libvips cache key
        id: codec-key
        shell: pwsh
        run: ./build/Write-NativeBuildCacheKeys.ps1 -OutputPath $env:GITHUB_OUTPUT
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: codec-cache
        with:
          path: artifacts/native/sharp-libvips-custom
          key: libvips-${{ runner.os }}-${{ steps.codec-key.outputs.codec }}-${{ hashFiles('build/Build-CustomSharpLibvips.ps1', 'build/NativeMediaValidation.psm1', 'build/Common.psm1', 'media-patches/**') }}
      - name: Verify raw libvips from the selected qualification
        if: steps.codec-cache.outputs.cache-hit != 'true'
        id: native-reuse
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFIED_RUN_ID: ${{ needs.plan.outputs.run_id }}
          QUALIFIED_ARTIFACT_ID: ${{ needs.plan.outputs.artifact_id }}
          QUALIFIED_ARTIFACT_DIGEST: ${{ needs.plan.outputs.artifact_digest }}
        run: python .github/scripts/qualified_release.py prepare-native
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: steps.native-reuse.outputs.reused == 'true'
        with:
          path: artifacts/native/sharp-libvips-custom
          key: ${{ steps.codec-cache.outputs.cache-primary-key }}
  postgres:
    needs: [plan, validate]
    if: needs.plan.outputs.test_reuse != 'true' && (github.event_name == 'push' || github.event_name == 'pull_request' || inputs.component == 'all' || inputs.component == 'postgres')
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.plan.outputs.checkout || github.sha }}
          persist-credentials: false
      - name: Select PostgreSQL extension cache key
        id: postgres-key
        shell: pwsh
        run: ./build/Write-NativeBuildCacheKeys.ps1 -OutputPath $env:GITHUB_OUTPUT
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: postgres-cache
        with:
          path: artifacts/native/postgres-extensions
          key: postgres-extensions-${{ runner.os }}-${{ steps.postgres-key.outputs.postgres }}-${{ hashFiles('build/Build-PgVector.ps1', 'build/Build-VectorChord.ps1', 'build/Write-PostgresBuildMetadata.ps1', 'build/Common.psm1') }}
      - name: Build PostgreSQL 18 extensions
        if: steps.postgres-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $pgVersion = (Get-Content -Raw dependencies/versions.json | ConvertFrom-Json).postgresql.chocolateyVersion
          choco install postgresql18 --version $pgVersion -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'PostgreSQL 18 installation failed.' }
          $env:LIBCLANG_PATH = 'C:\Program Files\LLVM\bin'
          .\build\Enter-VsDevEnvironment.ps1
          .\build\Build-PgVector.ps1 -PostgresRoot 'C:\Program Files\PostgreSQL\18'
          .\build\Build-VectorChord.ps1 -PostgresRoot 'C:\Program Files\PostgreSQL\18' -InstallCargoPgrx
          .\build\Write-PostgresBuildMetadata.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: postgres-extensions
          path: artifacts/native/postgres-extensions
          retention-days: 1
          if-no-files-found: error
  migration:
    needs: [plan, validate]
    if: inputs.component == 'migration'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.plan.outputs.checkout || github.sha }}
          persist-credentials: false
      - name: Build migration tools archive
        shell: pwsh
        run: ./packaging/New-MigrationToolsArchive.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: migration-tools
          compression-level: 0
          path: dist/*-migration-tools.zip
          if-no-files-found: error
  assemble:
    if: ${{ (github.event_name == 'push' || github.event_name == 'pull_request' || inputs.component == 'all') && needs.codec.result == 'success' && needs.postgres.result == 'success' }}
    needs: [plan, validate, codec, postgres]
    runs-on: windows-2025
    timeout-minutes: 180
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.plan.outputs.checkout || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: libvips
          path: artifacts/native/sharp-libvips-custom
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: postgres-extensions
          path: artifacts/native/postgres-extensions
      - name: Select application cache keys
        id: application-key
        shell: pwsh
        run: |
          ./build/Write-AppBuildCacheKeys.ps1 -OutputPath $env:GITHUB_OUTPUT
          $upstream = Get-Content -Raw -LiteralPath upstream.json | ConvertFrom-Json
          "upstream=$($upstream.version)-$($upstream.commit)" >> $env:GITHUB_OUTPUT
          $sharp = (Get-Content -Raw dependencies/versions.json | ConvertFrom-Json).sharp.version
          $native = Get-Content -Raw artifacts/native/sharp-libvips-custom/immich-windows-libvips.json | ConvertFrom-Json
          "forwarder=$sharp-$($native.nativeBuildInputsSha256)-$env:ImageVersion" >> $env:GITHUB_OUTPUT
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: application-cache
        with:
          path: artifacts/application
          key: application-${{ runner.os }}-${{ steps.application-key.outputs.application }}-${{ steps.application-key.outputs.upstream }}-${{ hashFiles('patches/server/**', 'patches/series', 'metadata-patches/server/**', 'metadata-patches/series', 'build/Write-AppBuildCacheKeys.ps1', 'build/Build-All.ps1', 'build/Build-Immich.ps1', 'build/Fetch-Geodata.ps1', 'build/Prepare-Source.ps1', 'build/Bootstrap-BuildTools.ps1', 'build/Common.psm1') }}
          restore-keys: application-${{ runner.os }}-
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: forwarder-cache
        with:
          path: artifacts/native/sharp-libvips-forwarder
          key: sharp-forwarder-${{ runner.os }}-${{ steps.application-key.outputs.forwarder }}-${{ hashFiles('build/Stage-CustomSharpLibvips.ps1') }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: ml-cache
        with:
          path: artifacts/machine-learning
          key: machine-learning-${{ runner.os }}-${{ steps.application-key.outputs.machineLearning }}-${{ steps.application-key.outputs.upstream }}-${{ hashFiles('patches/machine-learning/**', 'patches/series', 'build/Write-AppBuildCacheKeys.ps1', 'build/Build-All.ps1', 'build/Build-MachineLearning.ps1', 'build/Prepare-Source.ps1', 'build/Bootstrap-BuildTools.ps1', 'build/Common.psm1') }}
          restore-keys: machine-learning-${{ runner.os }}-
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: build-downloads
        with:
          path: .cache
          key: build-downloads-corepack-v1-${{ runner.os }}-${{ hashFiles('dependencies/versions.json', 'build/Bootstrap-BuildTools.ps1', 'build/Fetch-NodeRuntime.ps1', 'tests/Fetch-MediaFixtures.ps1') }}
          # Reuse the matching archive cache once when seeding Corepack.
          restore-keys: build-downloads-${{ runner.os }}-${{ hashFiles('dependencies/versions.json', 'build/Bootstrap-BuildTools.ps1', 'build/Fetch-NodeRuntime.ps1', 'tests/Fetch-MediaFixtures.ps1') }}
      - name: Build and qualify Windows package
        shell: pwsh
        env:
          # Keep the pinned pnpm package in the existing download cache.
          COREPACK_HOME: ${{ github.workspace }}/.cache/corepack
        run: |
          $fixtures = @(./tests/Fetch-MediaFixtures.ps1 -Destination (Join-Path $env:GITHUB_WORKSPACE '.cache/media-fixtures'))
          .\build\Enter-VsDevEnvironment.ps1
          .\build\Build-All.ps1 -SkipNativeDependencies -CustomSharpLibvipsBundle ./artifacts/native/sharp-libvips-custom -SharpFixture $fixtures
          & ./.tools/node/node.exe ./tests/Metadata-DateFallback.cjs .work/immich --server-root artifacts/application/server
          if ($LASTEXITCODE -ne 0) { throw 'Metadata date fallback checks failed.' }
          & ./.tools/node/node.exe --test ./tests/Metadata-DateRepair-Core.test.cjs ./tests/Metadata-DateRepair-Gates.test.cjs ./tests/Metadata-DateRepair-Guided.test.cjs ./tests/Metadata-DateRepair-Performance.test.cjs ./tests/Metadata-DateRepair-Resume.test.cjs ./tests/Metadata-DateRepair-Diagnostics.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Metadata date repair guard checks failed.' }
          .\build\Stage-VcRuntime.ps1
          $version = '${{ needs.plan.outputs.version }}'
          $folder = "immich-windows-$version-win-x64"
          .\packaging\New-NativeDependenciesArchive.ps1
          .\packaging\New-Package.ps1
          & "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe" -NoProfile -File ./tests/Tray-Controller.ps1 -Executable "dist/$folder/runtime/tray/ImmichTray.exe" -IconPath "dist/$folder/build/www/favicon.ico"
          if ($LASTEXITCODE -ne 0) { throw 'Notification-area controller tests failed.' }
          .\packaging\Test-ReleasePackage.ps1 -PackageRoot "dist/$folder" -Version $version
          Compress-Archive -Path "dist/$folder" -DestinationPath "dist/$folder.zip" -CompressionLevel Optimal -Force
          .\packaging\New-MigrationToolsArchive.ps1
      - name: Stage source metadata and asset hashes before installation tests
        env:
          QUALIFICATION_SOURCE: ${{ needs.plan.outputs.checkout || github.sha }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: python .github/scripts/qualified_release.py record --version "$env:VERSION"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: steps.application-cache.outputs.cache-hit != 'true'
        with:
          path: artifacts/application
          key: ${{ steps.application-cache.outputs.cache-primary-key }}
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: steps.forwarder-cache.outputs.cache-hit != 'true'
        with:
          path: artifacts/native/sharp-libvips-forwarder
          key: ${{ steps.forwarder-cache.outputs.cache-primary-key }}
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: steps.ml-cache.outputs.cache-hit != 'true'
        with:
          path: artifacts/machine-learning
          key: ${{ steps.ml-cache.outputs.cache-primary-key }}
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: steps.build-downloads.outputs.cache-hit != 'true'
        with:
          path: .cache
          key: ${{ steps.build-downloads.outputs.cache-primary-key }}
      - name: Select PostgreSQL runtime cache key
        id: pg-runtime
        shell: pwsh
        run: |
          $version = (Get-Content -Raw dependencies/versions.json | ConvertFrom-Json).postgresql.chocolateyVersion
          "version=$version" >> $env:GITHUB_OUTPUT
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: pg-runtime-cache
        with:
          path: C:\Program Files\PostgreSQL\18
          key: postgresql-runtime-${{ runner.os }}-${{ steps.pg-runtime.outputs.version }}
      - name: Start PostgreSQL test service
        shell: pwsh
        run: |
          .\tests\actions\Start-TestPostgres.ps1 -PostgresRoot 'C:\Program Files\PostgreSQL\18' `
            -DataRoot (Join-Path $env:RUNNER_TEMP 'postgresql18-data') `
            -PasswordFile (Join-Path $env:RUNNER_TEMP 'immich-postgres-password.txt')
          $env:PGHOST='127.0.0.1'
          $env:PGPORT='5432'
          $env:PGUSER='postgres'
          $env:PGDATABASE='postgres'
          $env:PGPASSWORD=Get-Content -Raw -LiteralPath (Join-Path $env:RUNNER_TEMP 'immich-postgres-password.txt')
          try {
            & ./.tools/node/node.exe ./tests/Server-Portability.cjs .work/immich --server-root artifacts/application/server --psql 'C:\Program Files\PostgreSQL\18\bin\psql.exe'
            if ($LASTEXITCODE -ne 0) { throw 'PostgreSQL path portability checks failed.' }
          } finally { Remove-Item Env:PGPASSWORD -ErrorAction SilentlyContinue }
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: steps.pg-runtime-cache.outputs.cache-hit != 'true'
        with:
          path: C:\Program Files\PostgreSQL\18
          key: postgresql-runtime-${{ runner.os }}-${{ steps.pg-runtime.outputs.version }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: runtime-downloads
        with:
          path: |
            ${{ runner.temp }}/immich-install/cache/downloads
            !${{ runner.temp }}/immich-install/cache/downloads/immich-windows-*
            ${{ runner.temp }}/immich-install/cache/npm
            ${{ runner.temp }}/immich-install/cache/uv
            ${{ runner.temp }}/immich-install/cache/pnpm-store
          key: runtime-downloads-${{ runner.os }}-${{ hashFiles('dependencies/versions.json', 'artifacts/machine-learning/requirements.txt', 'dist/**/pnpm-lock.yaml') }}
      - name: Install, upgrade and test both Windows scopes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ needs.plan.outputs.version }}'
          $folder = "immich-windows-$version-win-x64"
          $installRoot = Join-Path $env:RUNNER_TEMP 'immich-install'
          $dataRoot = Join-Path $env:RUNNER_TEMP 'immich-data'
          $mediaRoot = Join-Path $env:RUNNER_TEMP 'immich-media'
          $expanded = Join-Path $env:RUNNER_TEMP 'immich-package'
          Expand-Archive -LiteralPath "dist/$folder.zip" -DestinationPath $expanded
          $packageRoot = Join-Path $expanded $folder
          & "$packageRoot/installer/Test-ReleasePackage.ps1" -PackageRoot $packageRoot -Version $version
          $downloadCache = Join-Path $installRoot 'cache\downloads'
          New-Item -ItemType Directory -Path $downloadCache,$mediaRoot -Force | Out-Null
          $pins = Get-Content -Raw dependencies/versions.json | ConvertFrom-Json
          foreach ($archive in @($pins.node.asset, "uv-$($pins.uv.version)-$($pins.uv.asset)")) {
            Copy-Item (Join-Path '.cache' $archive) $downloadCache -Force
          }
          Copy-Item "dist/immich-windows-$version-native-dependencies.zip" $downloadCache
          $baseline = ./tests/actions/Get-UpgradeBaseline.ps1 -CandidatePackageRoot $packageRoot `
            -Destination (Join-Path $env:RUNNER_TEMP 'immich-upgrade-baseline') -DownloadCache $downloadCache
          $baselineRoot = $baseline.PackageRoot
          Remove-Item Env:GH_TOKEN -ErrorAction SilentlyContinue
          $password = Get-Content -Raw -LiteralPath (Join-Path $env:RUNNER_TEMP 'immich-postgres-password.txt')
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot;$PSHOME"
          $scopeTimer = [Diagnostics.Stopwatch]::StartNew()
          Write-Host "Qualifying AllUsers: released $($baseline.Version) install, actual upgrade to $version, smoke and ML lifecycle"
          & "$baselineRoot/installer/Install.ps1" -PackageRoot $baselineRoot -Scope AllUsers `
            -InstallRoot $installRoot -DataRoot $dataRoot -MediaRoot $mediaRoot `
            -DatabasePassword $password -DatabaseName 'immich_ci_allusers' -PostgresRoot 'C:\Program Files\PostgreSQL\18'
          $fixtures = @(Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE '.cache/media-fixtures') -File -Recurse | Select-Object -ExpandProperty FullName)
          ./tests/actions/Test-RevisionUpgrade.ps1 -PackageRoot $packageRoot -BaselinePackageRoot $baselineRoot -InstallRoot $installRoot -DataRoot $dataRoot -Scope AllUsers -SharpFixture $fixtures -TestMachineLearningLifecycle
          # Reuse this already migrated, stopped disposable CI installation.
          $env:IMMICH_METADATA_REPAIR_TEST_ONLY = '1'
          try {
            & "$installRoot/current/runtime/node/node.exe" ./tests/Metadata-DateRepair-Integration.cjs `
              --release-root "$installRoot/current" `
              --password-file (Join-Path $env:RUNNER_TEMP 'immich-postgres-password.txt')
            if ($LASTEXITCODE -ne 0) { throw 'Installed metadata date repair checks failed.' }
          } finally { Remove-Item Env:IMMICH_METADATA_REPAIR_TEST_ONLY -ErrorAction SilentlyContinue }
          Write-Host ('AllUsers qualification passed in {0:n1}s' -f $scopeTimer.Elapsed.TotalSeconds)

          # Verify the real profile before using the disposable CI profile.
          # Verify both default paths and the product's existing containment guard.
          Import-Module "$packageRoot/runtime/Common.psm1" -Force
          $originalLocalAppData = $env:LOCALAPPDATA
          $defaultUserPaths = Resolve-ImmichInstallPaths -Scope CurrentUser
          if ($defaultUserPaths.InstallRoot -cne (Join-Path $originalLocalAppData 'Programs\Immich') -or
              $defaultUserPaths.DataRoot -cne (Join-Path $originalLocalAppData 'Immich')) {
            throw 'CurrentUser default paths do not match the real user profile.'
          }
          $outsideProfile = Join-Path (Split-Path $originalLocalAppData -Parent) 'immich-ci-outside-profile'
          foreach ($parameter in @('InstallRoot','DataRoot')) {
            $pathArguments = @{ Scope = 'CurrentUser' }
            $pathArguments[$parameter] = $outsideProfile
            $rejected = $false
            try { Resolve-ImmichInstallPaths @pathArguments | Out-Null } catch {
              if ($_.Exception.Message -ne 'CurrentUser installation paths must remain under LOCALAPPDATA.') { throw }
              $rejected = $true
            }
            if (-not $rejected) { throw "CurrentUser accepted $parameter outside LOCALAPPDATA." }
          }
          Write-Host 'CurrentUser real-profile defaults and both path containment guards passed.'

          # Keep disposable payloads on the runner's work volume with their cache.
          # The real HKCU and Startup shortcut tests still run with explicit roots.
          $scopeTimer.Restart()
          try {
            $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'immich-user-profile'
            $userPaths = Resolve-ImmichInstallPaths -Scope CurrentUser
            $userRoot = $userPaths.InstallRoot
            $userData = $userPaths.DataRoot
            if ([IO.Path]::GetPathRoot($userRoot) -ine [IO.Path]::GetPathRoot($installRoot)) {
              throw 'Disposable CurrentUser installation and dependency cache must share a volume.'
            }
            Write-Host "Qualifying CurrentUser: released $($baseline.Version) install, actual upgrade to $version, smoke and ML lifecycle"
            New-Item -ItemType Directory -Path $userRoot -Force | Out-Null
            New-Item -ItemType Junction -Path "$userRoot/cache" -Target "$installRoot/cache" | Out-Null
            & "$baselineRoot/installer/Install.ps1" -PackageRoot $baselineRoot -Scope CurrentUser `
              -InstallRoot $userRoot -DataRoot $userData -EnvFile "$dataRoot/immich.env" -DatabaseName 'immich_ci_currentuser'
            ./tests/actions/Test-RevisionUpgrade.ps1 -PackageRoot $packageRoot -BaselinePackageRoot $baselineRoot -InstallRoot $userRoot -DataRoot $userData -Scope CurrentUser -SharpFixture $fixtures -TestMachineLearningLifecycle
            Write-Host ('CurrentUser qualification passed in {0:n1}s' -f $scopeTimer.Elapsed.TotalSeconds)
          } finally {
            $env:LOCALAPPDATA = $originalLocalAppData
          }

          # One separate fresh-candidate case proves service/database creation,
          # which upgrading an existing baseline cannot exercise. Retain the same
          # downloaded cache; never rebuild or reacquire the released baseline.
          $scopeTimer.Restart()
          Write-Host "Qualifying fresh AllUsers candidate ${version}: new services and empty database"
          $retainedCache = Join-Path $env:RUNNER_TEMP 'immich-retained-cache'
          Move-Item -LiteralPath (Join-Path $installRoot 'cache') -Destination $retainedCache
          try {
            & "$packageRoot/installer/Uninstall.ps1" -Scope AllUsers -InstallRoot $installRoot -DataRoot $dataRoot -Confirm:$false
          } finally {
            New-Item -ItemType Directory -Path $installRoot -Force | Out-Null
            Move-Item -LiteralPath $retainedCache -Destination (Join-Path $installRoot 'cache')
          }
          foreach ($name in @('ImmichServer','ImmichMachineLearning','ImmichValkey')) {
            if (Get-Service -Name $name -ErrorAction SilentlyContinue) { throw "Fresh-install fixture still has service $name" }
          }
          $freshData = Join-Path $env:RUNNER_TEMP 'immich-fresh-data'
          $freshMedia = Join-Path $env:RUNNER_TEMP 'immich-fresh-media'
          New-Item -ItemType Directory -Path $freshMedia -Force | Out-Null
          & "$packageRoot/installer/Install.ps1" -PackageRoot $packageRoot -Scope AllUsers `
            -InstallRoot $installRoot -DataRoot $freshData -MediaRoot $freshMedia `
            -DatabasePassword $password -DatabaseName 'immich_ci_fresh' -PostgresRoot 'C:\Program Files\PostgreSQL\18'
          & "$packageRoot/tests/Smoke-Windows.ps1" -InstallRoot $installRoot -DataRoot $freshData `
            -PostgresRoot 'C:\Program Files\PostgreSQL\18' -SharpFixture $fixtures
          & "$packageRoot/runtime/launchers/Stop-Immich.ps1" -InstallRoot $installRoot -DataRoot $freshData -EnvFile "$freshData/immich.env"
          Write-Host ('Fresh AllUsers candidate qualification passed in {0:n1}s' -f $scopeTimer.Elapsed.TotalSeconds)
      - name: Collect sanitized ML failure diagnostics
        if: failure()
        shell: pwsh
        run: |
          $scopes = @(
            @{ Name = 'AllUsers'; InstallRoot = (Join-Path $env:RUNNER_TEMP 'immich-install'); DataRoot = (Join-Path $env:RUNNER_TEMP 'immich-data') },
            @{ Name = 'AllUsersFresh'; InstallRoot = (Join-Path $env:RUNNER_TEMP 'immich-install'); DataRoot = (Join-Path $env:RUNNER_TEMP 'immich-fresh-data') },
            @{ Name = 'CurrentUser'; InstallRoot = (Join-Path $env:RUNNER_TEMP 'immich-user-profile\Programs\Immich'); DataRoot = (Join-Path $env:RUNNER_TEMP 'immich-user-profile\Immich') }
          )
          foreach ($scope in $scopes) {
            Write-Host "::group::Sanitized $($scope.Name) ML failure diagnostics"
            try {
              ./tests/actions/Write-MachineLearningDiagnostics.ps1 -InstallRoot $scope.InstallRoot -DataRoot $scope.DataRoot
            } catch {
              Write-Warning "Sanitized $($scope.Name) ML diagnostics could not be collected."
            } finally { Write-Host '::endgroup::' }
          }
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: always() && !cancelled() && steps.runtime-downloads.outputs.cache-primary-key != '' && steps.runtime-downloads.outputs.cache-hit != 'true'
        with:
          path: |
            ${{ runner.temp }}/immich-install/cache/downloads
            !${{ runner.temp }}/immich-install/cache/downloads/immich-windows-*
            ${{ runner.temp }}/immich-install/cache/npm
            ${{ runner.temp }}/immich-install/cache/uv
            ${{ runner.temp }}/immich-install/cache/pnpm-store
          key: ${{ steps.runtime-downloads.outputs.cache-primary-key }}
      - name: Verify tested source and staged asset hashes remained unchanged
        run: python .github/scripts/reuse_qualification.py finish
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: qualified-windows-package-v1
          compression-level: 0
          path: |
            dist/*-win-x64.zip
            dist/*-native-dependencies.zip
            dist/*-migration-tools.zip
            dist/Install.cmd
            dist/qualification.json
          retention-days: 14
          if-no-files-found: error
  publish:
    needs: [plan, ci-tools, assemble]
    if: ${{ always() && !cancelled() && github.ref == 'refs/heads/main' && needs.plan.result == 'success' && needs.ci-tools.result == 'success' && needs.plan.outputs.publish == 'true' && (needs.plan.outputs.reuse == 'true' || needs.assemble.result == 'success') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.plan.outputs.checkout || github.sha }}
          persist-credentials: false
      - name: Verify and publish or resume the exact qualified release
        env:
          GH_TOKEN: ${{ github.token }}
          METADATA_ONLY: ${{ needs.plan.outputs.metadata_only }}
          QUALIFIED_RUN_ID: ${{ needs.plan.outputs.run_id }}
          QUALIFIED_ARTIFACT_ID: ${{ needs.plan.outputs.artifact_id }}
          QUALIFIED_ARTIFACT_DIGEST: ${{ needs.plan.outputs.artifact_digest }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: python .github/scripts/qualified_release.py publish --version "$VERSION"
