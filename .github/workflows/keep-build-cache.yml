name: keep-native-build-cache

on:
  schedule:
    - cron: '23 4 */5 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codec:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Select libvips cache key
        id: cache-key
        shell: pwsh
        run: ./build/Write-NativeBuildCacheKeys.ps1 -OutputPath $env:GITHUB_OUTPUT
      - uses: actions/cache/restore@v6
        id: cache
        with:
          path: artifacts/native/sharp-libvips-custom
          key: libvips-${{ runner.os }}-${{ steps.cache-key.outputs.codec }}-${{ hashFiles('build/Build-CustomSharpLibvips.ps1', 'build/NativeMediaValidation.psm1', 'build/Common.psm1', 'media-patches/**') }}
      - name: Report cache status
        shell: pwsh
        run: "\"libvips cache hit: ${{ steps.cache.outputs.cache-hit }}; restored: ${{ steps.cache.outputs.cache-matched-key }}\" >> $env:GITHUB_STEP_SUMMARY"

  postgres:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - name: Select PostgreSQL extension cache key
        id: cache-key
        shell: pwsh
        run: ./build/Write-NativeBuildCacheKeys.ps1 -OutputPath $env:GITHUB_OUTPUT
      - uses: actions/cache/restore@v6
        id: cache
        with:
          path: artifacts/native/postgres-extensions
          key: postgres-extensions-${{ runner.os }}-${{ steps.cache-key.outputs.postgres }}-${{ hashFiles('build/Build-PgVector.ps1', 'build/Build-VectorChord.ps1', 'build/Write-PostgresBuildMetadata.ps1', 'build/Common.psm1') }}
      - name: Select PostgreSQL runtime cache key
        id: runtime-key
        shell: pwsh
        run: |
          $version = (Get-Content -Raw dependencies/versions.json | ConvertFrom-Json).postgresql.chocolateyVersion
          "version=$version" >> $env:GITHUB_OUTPUT
      - uses: actions/cache/restore@v6
        id: runtime-cache
        with:
          path: C:\Program Files\PostgreSQL\18
          key: postgresql-runtime-${{ runner.os }}-${{ steps.runtime-key.outputs.version }}
      - name: Report cache status
        shell: pwsh
        run: |
          "PostgreSQL extension cache hit: ${{ steps.cache.outputs.cache-hit }}" >> $env:GITHUB_STEP_SUMMARY
          "PostgreSQL runtime cache hit: ${{ steps.runtime-cache.outputs.cache-hit }}" >> $env:GITHUB_STEP_SUMMARY

  application:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - name: Select application cache keys
        id: cache-key
        shell: pwsh
        run: |
          ./build/Write-AppBuildCacheKeys.ps1 -OutputPath $env:GITHUB_OUTPUT
          $upstream = Get-Content -Raw -LiteralPath upstream.json | ConvertFrom-Json
          "upstream=$($upstream.version)-$($upstream.commit)" >> $env:GITHUB_OUTPUT
      - uses: actions/cache/restore@v6
        id: server-cache
        with:
          path: artifacts/application
          key: application-${{ runner.os }}-${{ steps.cache-key.outputs.application }}-${{ steps.cache-key.outputs.upstream }}-${{ hashFiles('patches/server/**', 'patches/series', 'metadata-patches/server/**', 'metadata-patches/series', 'build/Write-AppBuildCacheKeys.ps1', 'build/Build-All.ps1', 'build/Build-Immich.ps1', 'build/Fetch-Geodata.ps1', 'build/Prepare-Source.ps1', 'build/Bootstrap-BuildTools.ps1', 'build/Common.psm1') }}
      - uses: actions/cache/restore@v6
        id: ml-cache
        with:
          path: artifacts/machine-learning
          key: machine-learning-${{ runner.os }}-${{ steps.cache-key.outputs.machineLearning }}-${{ steps.cache-key.outputs.upstream }}-${{ hashFiles('patches/machine-learning/**', 'patches/series', 'build/Write-AppBuildCacheKeys.ps1', 'build/Build-All.ps1', 'build/Build-MachineLearning.ps1', 'build/Prepare-Source.ps1', 'build/Bootstrap-BuildTools.ps1', 'build/Common.psm1') }}
      - name: Report cache status
        shell: pwsh
        run: |
          "Application cache hit: ${{ steps.server-cache.outputs.cache-hit }}" >> $env:GITHUB_STEP_SUMMARY
          "Machine learning cache hit: ${{ steps.ml-cache.outputs.cache-hit }}" >> $env:GITHUB_STEP_SUMMARY
