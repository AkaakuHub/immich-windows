name: refresh-reviewed-native-cache
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  codec:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache/restore@v6
        with:
          path: artifacts/native/sharp-libvips-custom
          key: libvips-Linux-8.18.5-695b4511e498d35ea736b6315b5afb1f5144cac8-7c28da9c2b8b5b8defe54f2ae92ee474c0e2d6e4-x86_64-w64-mingw32.shared-vips-all-jpegli-0.35.3-06e964fb6eac1a4583a4ca6c683411da98d78813fed9c79b9d1851626d8fb173
          fail-on-cache-miss: true
      - id: keys
        shell: pwsh
        run: ./build/Write-NativeBuildCacheKeys.ps1 -OutputPath $env:GITHUB_OUTPUT
      - uses: actions/cache/save@v6
        with:
          path: artifacts/native/sharp-libvips-custom
          key: libvips-${{ runner.os }}-${{ steps.keys.outputs.codec }}-${{ hashFiles('build/Build-CustomSharpLibvips.ps1', 'build/Common.psm1', 'media-patches/**') }}
  postgres:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache/restore@v6
        with:
          path: artifacts/native/postgres-extensions
          key: postgres-extensions-Windows-18-18.6-159b79aaad5983fb7459c1e3df2897fbb2d11788-f9b5e234c44cee69b266b8431f92b7deed4e99d3-0.17.0-1.95.0-483bee7ce1a327ce8c40f5f077a4bf0332ffa62adedfa7fd131f3dd202cc4a33
          fail-on-cache-miss: true
      - id: keys
        shell: pwsh
        run: |
          ./build/Write-NativeBuildCacheKeys.ps1 -OutputPath $env:GITHUB_OUTPUT
          ./build/Write-PostgresBuildMetadata.ps1
      - uses: actions/cache/save@v6
        with:
          path: artifacts/native/postgres-extensions
          key: postgres-extensions-${{ runner.os }}-${{ steps.keys.outputs.postgres }}-${{ hashFiles('build/Build-PgVector.ps1', 'build/Build-VectorChord.ps1', 'build/Write-PostgresBuildMetadata.ps1', 'build/Common.psm1') }}
